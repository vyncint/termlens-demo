[package]
name = "termlens-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taskboard"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
signal-hook = "0.4.4"
libc = "0.2"

[dev-dependencies]
# Everything under test comes from crates.io — never a path dependency or a
# [patch.crates-io] stanza. See ecosystem/docs/TESTING.md.
termlens = { version = "0.11", features = ["decode", "regex", "serde"] }
insta = { version = "1", features = ["json"] }
serde_json = "1"
regex = "1"
